name: Release

# `npm run release` (vrt release-npm) raises the version, commits it to
# `main` with a tag like "v0.3.0", pushes both and creates the GitHub release
# with its notes. This workflow then releases the tagged commit: the images
# that CI built and tested for it (tagged `sha-<commit>`) get the version as
# their tags, without being built again, and the release notes get the names
# of the images. For a tag pushed by hand, it creates the release itself.
# The tag must match the version in package.json. A prerelease
# ("v0.3.0-rc.1") gets only its full version as a tag, so `0.3` stays the
# last release.
#
# It can also be started by hand for a tag, e.g. to run it again after CI
# was cancelled for the tagged commit: `gh workflow run release.yml -f tag=v0.3.0`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag of the release, e.g. "v0.3.0"'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  # The pushed tag, or the one given by hand. Only used through the
  # environment, so a tag name cannot inject shell.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      # to create the GitHub release
      contents: write
      # to add tags to the images
      packages: write
      # to see whether CI's run for the tagged commit failed
      actions: read
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::\"$TAG\" is no tag like v0.3.0 or v0.3.0-rc.1"
            exit 1
          fi

      # the tagged commit, also when started by hand from another branch
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check that the tag matches the version
        run: |
          version="$(jq -r .version package.json)"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match version $version in package.json"
            exit 1
          fi

      - name: Lowercase image name
        id: image
        run: |
          name="ghcr.io/${{ github.repository }}"
          echo "name=${name,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # When the tag is pushed together with its commit, CI is still testing
      # and building the images; that takes about 5 minutes, 15 when its
      # build cache is cold. When CI fails or is cancelled, it pushes no
      # images, so there is no point in waiting any longer.
      - name: Wait for the images of the commit
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          commit="$(git rev-parse HEAD)"
          sha="sha-${commit::7}" # as docker/metadata-action names it
          retry="Fix or re-run CI for $commit, then run this workflow again: gh workflow run release.yml -f tag=$TAG"
          for suffix in '' -gpu -server; do
            for attempt in $(seq 60); do
              if docker buildx imagetools inspect "$IMAGE:$sha$suffix" >/dev/null 2>&1; then
                echo "found $IMAGE:$sha$suffix"
                continue 2
              fi
              ci="$(gh run list --workflow ci.yml --commit "$commit" --limit 1 --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')"
              if [[ "$ci" == completed* && "$ci" != "completed success" ]]; then
                echo "::error::CI's run for $commit ended with ${ci#completed }, so it pushed no images. $retry"
                exit 1
              fi
              [ "$attempt" = 1 ] && echo "waiting for $IMAGE:$sha$suffix …"
              sleep 30
            done
            echo "::error::No image $IMAGE:$sha$suffix after 30 minutes. $retry"
            exit 1
          done

      - name: Tag the images with the version
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          commit="$(git rev-parse HEAD)"
          sha="sha-${commit::7}"
          version="${TAG#v}"
          tags=("$version")
          if [[ "$version" != *-* ]]; then
            major="${version%%.*}"
            minor="${version%.*}"
            tags+=("$minor")
            # 0.x has no stable major version to follow
            if [ "$major" != 0 ]; then tags+=("$major"); fi
          fi
          for suffix in '' -gpu -server; do
            args=()
            for tag in "${tags[@]}"; do args+=(--tag "$IMAGE:$tag$suffix"); done
            docker buildx imagetools create "${args[@]}" "$IMAGE:$sha$suffix"
            echo "$IMAGE:$sha$suffix → ${tags[*]/%/$suffix}"
          done

      # `npm run release` has created the release by now: it does so right
      # after pushing the tag, and the images take minutes. Its notes keep
      # their text and get the images added, once.
      - name: Add the images to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          version="${TAG#v}"
          images="## Docker images

          - \`$IMAGE:$version\`: the renderer
          - \`$IMAGE:$version-gpu\`: the renderer with the drivers for \`--gpu\`
          - \`$IMAGE:$version-server\`: the render server"

          if gh release view "$TAG" >/dev/null 2>&1; then
            notes="$(gh release view "$TAG" --json body --jq .body)"
            if grep -q '^## Docker images' <<< "$notes"; then
              echo "The notes of $TAG list the images already."
              exit 0
            fi
            gh release edit "$TAG" --notes "$notes"$'\n\n'"$images"
          else
            prerelease=false
            if [[ "$version" == *-* ]]; then prerelease=true; fi
            gh release create "$TAG" --verify-tag --generate-notes --notes "$images" --prerelease="$prerelease"
          fi
