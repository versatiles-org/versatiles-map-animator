name: Build and push render image

# Pull requests only build the images. On `main`, CI (ci.yml) calls this
# workflow after its tests pass, so an image is never pushed for a commit
# that fails them.
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  # Per-ref group: a new push supersedes any in-flight build on the same ref.
  # Tag pushes have unique refs, so concurrent releases won't cancel each
  # other. Not `github.workflow`: in a called workflow that is the caller's
  # name, and the same group as the caller's own would cancel the call.
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # `gpu` is the same image plus the GPU drivers that `--gpu` needs;
        # its tags end in `-gpu` (see the GPU arg in render/Dockerfile).
        include:
          - variant: default
            gpu: 'false'
            suffix: ''
            target: renderer
          - variant: gpu
            gpu: 'true'
            suffix: '-gpu'
            target: renderer
          # The render server (server/), built on the default image.
          - variant: server
            gpu: 'false'
            suffix: '-server'
            target: server
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase image name
        id: image
        run: |
          name="ghcr.io/${{ github.repository }}"
          echo "name=${name,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Build${{ github.event_name == 'pull_request' && '' || ' and push' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: render/Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            GPU=${{ matrix.gpu }}
          # Multi-arch so Apple-Silicon and arm64 Linux can pull directly.
          # arm64 builds run under QEMU on amd64 runners; that's slow but only
          # noticeable on the first push (gha cache covers subsequent runs).
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One cache per variant, or each build would evict the other's layers.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
