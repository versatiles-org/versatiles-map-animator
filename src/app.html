<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Compose camera animations on a VersaTiles map." />
		<!-- Link previews. Here and not in a page's <svelte:head>: without SSR
		     that is added by script, and preview crawlers run none. The image
		     must be an absolute URL, so it points to the published site. -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Map Animator – VersaTiles" />
		<meta property="og:description" content="Compose camera animations on a VersaTiles map." />
		<meta
			property="og:image"
			content="https://versatiles.org/versatiles-map-animator/screenshot.jpg"
		/>
		<meta property="og:image:width" content="2400" />
		<meta property="og:image:height" content="1260" />
		<meta
			property="og:image:alt"
			content="The Map Animator editor with a satellite map of the Alps"
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<link
			rel="icon"
			type="image/png"
			href="https://versatiles.org/assets/logo/versatiles.32.png"
		/>
		%sveltekit.head%
	</head>
	<body data-color-mode="dark">
		%sveltekit.body%
	</body>
</html>
